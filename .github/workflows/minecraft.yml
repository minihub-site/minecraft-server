name: Minecraft Server with Auto-Save

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Server Directory & Download Minecraft
        run: |
          mkdir -p server
          cd server
          
          # Download Mojang Vanilla 1.20.4 Server directly (100% Reliable)
          curl -sSL -o server.jar "https://piston-data.mojang.com/v1/objects/8e1a057425e7949fda8d440ed97317e304a567d3/server.jar"
          
          echo "eula=true" > eula.txt

          # Restore Backup if exists
          if [ -d "../world_backup" ]; then
            echo "Restoring existing world data..."
            cp -r ../world_backup/* .
          fi

      - name: Setup Playit.gg
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          # Download direct binary for playit
          curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          sudo mv playit /usr/local/bin/

          # Verify secret
          if [ -z "$PLAYIT_SECRET" ]; then
            echo "PLAYIT_SECRET is missing! Please set it in GitHub Secrets."
            exit 1
          fi

          # Start playit in background
          playit secret "$PLAYIT_SECRET" &
          sleep 5

      - name: Start Minecraft Server
        run: |
          cd server
          java -Xmx6G -Xms6G -jar server.jar nogui

      - name: Auto-Save World Data to GitHub
        if: always()
        run: |
          mkdir -p world_backup
          cp -r server/world world_backup/ 2>/dev/null || true
          cp -r server/world_nether world_backup/ 2>/dev/null || true
          cp -r server/world_the_end world_backup/ 2>/dev/null || true

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add world_backup/
          git commit -m "Auto-save world data [skip ci]" || echo "No changes to commit"
          git push
