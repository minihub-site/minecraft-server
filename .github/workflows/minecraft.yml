name: Minecraft Server with Auto-Save

on:
  workflow_dispatch:

# පරණ Run එකක් තිබුණොත් ඒක නවතා අලුත් එක එකපාරින් Run කරයි
concurrency:
  group: minecraft-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Server Directory & Download Server
        run: |
          mkdir -p server
          cd server
          
          # Direct Working Purpur Minecraft 1.20.4 Download
          curl -sSL -o server.jar "https://api.purpurmc.org/v2/purpur/1.20.4/latest/download"
          
          echo "eula=true" > eula.txt

          # Restore Backup if exists
          if [ -d "../world_backup" ]; then
            echo "Restoring existing world data..."
            cp -r ../world_backup/* .
          fi

      - name: Setup Playit.gg
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          sudo mv playit /usr/local/bin/

          if [ -z "$PLAYIT_SECRET" ]; then
            echo "PLAYIT_SECRET is missing!"
            exit 1
          fi

          playit secret "$PLAYIT_SECRET" &
          sleep 5

      - name: Start Minecraft Server
        run: |
          cd server
          java -Xmx6G -Xms6G -jar server.jar nogui

      - name: Auto-Save World Data to GitHub
        if: always()
        run: |
          mkdir -p world_backup
          cp -r server/world world_backup/ 2>/dev/null || true
          cp -r server/world_nether world_backup/ 2>/dev/null || true
          cp -r server/world_the_end world_backup/ 2>/dev/null || true

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add world_backup/
          git commit -m "Auto-save world data [skip ci]" || echo "No changes to commit"
          git push
