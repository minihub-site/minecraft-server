name: Minecraft Server with Ngrok

on:
  workflow_dispatch:

concurrency:
  group: minecraft-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          curl -s https://bin.equinox.io/c/b4Pvu3qMjsy/ngrok-v3-stable-linux-amd64.tgz | tar -xzf -
          ./ngrok config add-authtoken $NGROK_AUTHTOKEN
          ./ngrok tcp 25565 --log=stdout > ngrok.log &

      - name: Prepare Server Directory & Download Server
        run: |
          mkdir -p server
          cd server
          curl -sSL -o server.jar "https://api.purpurmc.org/v2/purpur/1.20.4/latest/download"
          echo "eula=true" > eula.txt

          if [ -d "../world_backup" ]; then
            cp -r ../world_backup/* .
          fi

      - name: Get Ngrok IP Address
        run: |
          sleep 5
          echo "=========================================="
          echo "YOUR MINECRAFT SERVER IP ADDRESS IS BELOW:"
          curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'
          echo "=========================================="

      - name: Start Minecraft Server
        run: |
          cd server
          java -Xmx6G -Xms6G -jar server.jar nogui

      - name: Auto-Save World Data
        if: always()
        run: |
          mkdir -p world_backup
          cp -r server/world world_backup/ 2>/dev/null || true
          cp -r server/world_nether world_backup/ 2>/dev/null || true
          cp -r server/world_the_end world_backup/ 2>/dev/null || true

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add world_backup/
          git commit -m "Auto-save world data [skip ci]" || echo "No changes to commit"
          git push
